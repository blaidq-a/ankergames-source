name: AnkerGames Source Scraper

on:
  schedule:
    - cron: '0 0,12 * * *' # Günde 2 kez Otomatik Çalışır (Her 12 Saat)
  workflow_dispatch:

jobs:
  scrape-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5 Bağımsız GitHub Sanal Sunucusu (Farklı IP Adresleri)
        part: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run Scraper Part
        env:
          GITHUB_ACTIONS: 'true'
        run: |
          python scraper.py --part ${{ matrix.part }} --total-parts 5

      - name: Upload Part Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-part-${{ matrix.part }}
          path: source_part_${{ matrix.part }}.json

  merge-and-commit:
    needs: scrape-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: source-part-*
          merge-multiple: true

      - name: Merge JSON Parts
        run: |
          python -c "
          import json, glob
          all_downloads = []
          for f in sorted(glob.glob('source_part_*.json')):
              with open(f, 'r', encoding='utf-8') as file:
                  data = json.load(file)
                  all_downloads.extend(data.get('downloads', []))
          
          with open('source.json', 'w', encoding='utf-8') as out:
              json.dump({'name': 'AnkerGames Source', 'downloads': all_downloads}, out, ensure_ascii=False, indent=2)
          print(f'Toplam {len(all_downloads)} oyun source.json dosyasında birleştirildi.')
          "

      - name: Commit and Push Updated Source
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "chore: auto-update source.json with refreshed links" || exit 0
          git push